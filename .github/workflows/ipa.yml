name: Build IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Build Tonkeeper IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create Firebase plists
        run: |
          set -euo pipefail
          src=".github/GoogleService-Info.plist"
          dests=(
            Tonkeeper/Resources/Firebase/Tonkeeper
            Tonkeeper/Resources/Firebase/TonkeeperXDebug
            Tonkeeper/Resources/Firebase/TonkeeperXRelease
            Tonkeeper/Resources/Firebase/TonkeeperUK
            Tonkeeper/Resources/Firebase/Debug
            Tonkeeper/Resources/Firebase/Release
          )
          for dir in "${dests[@]}"; do
            mkdir -p "$dir"
            cp "$src" "$dir/GoogleService-Info.plist"
          done

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Tonkeeper.xcodeproj -scheme Tonkeeper

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Tonkeeper.xcodeproj \
            -scheme Tonkeeper \
            -configuration TonkeeperRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData/Build/Products -type d -name '*.app' -path '*iphoneos*' | head -n 1)"
          if [ -z "$APP" ]; then
            echo "Tonkeeper.app not found under iphoneos products"
            find build/DerivedData/Build/Products -maxdepth 3 -type d -print || true
            exit 1
          fi
          echo "Using app: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r Tonkeeper-5.1.1.ipa Payload
          ls -lh Tonkeeper-5.1.1.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tonkeeper-5.1.1.ipa
          path: Tonkeeper-5.1.1.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-5.1.1-${{ github.run_number }}
          name: IPA 5.1.1 (${{ github.run_number }})
          files: Tonkeeper-5.1.1.ipa
          generate_release_notes: true
